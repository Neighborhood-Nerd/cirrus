name: Planned Feature/Fix
description: Maintainers only. Track a feature or fix we already intend to ship.
title: "[Planned]: "
labels: ["planned"]
body:
  - type: markdown
    attributes:
      value: |
        For maintainers. Public ideas belong in **Feature Suggestion** or **Bug Report**.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Feature
        - Fix
        - Polish / UX
        - Infra / tooling
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Short name for the work.
      placeholder: Android Auto Discover should not auto-unlock
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Done when
      description: What “shipped” looks like.
      placeholder: |
        - Discover tap opens source picker instead of auto-resolve
        - Home and Library still play from local/library audio
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why now
      description: Optional. Bug report, user request, release goal, or risk if we skip it.
      placeholder: Linked from #14; wrong-file unlocks on Discover are confusing in the car.
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes / approach
      description: Optional. Files, APIs, or constraints you already know.
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 — blocking release
        - P1 — next up
        - P2 — whenever
        - Parking lot
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Related issues or PRs
      description: Optional. Issue numbers or links.
      placeholder: "#14, soundloom#…"
    validations:
      required: false
